[project]
name = "data-science"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "chart-studio>=1.1.0",
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
    "jupyterlab-widgets>=3.0.17",
    "matplotlib>=3.11.1",
    "nbformat>=5.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "plotly>=7.1.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
bokeh = [
    "jupyter-bokeh>=4.1.0",
    "jupyter-server-proxy>=4.6.0",
]
